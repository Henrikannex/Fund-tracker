name: DNB Disruptive Opportunities C1 EUR Acc
isin: LU2061961574
currency: EUR

# Uverifisert mot en primærkilde (dnbam.com/dnb.no svarte ikke ved research);
# to uavhengige fondsaggregatorer er enige om 0,76 %. Sjekk mot DNBs eget
# faktaark hvis dette blir avgjørende for noe mer enn e-postlinjen.
total_cost_pct: 0.76
trading_days_per_year: 252

# Kun brukt som sammenligningsfond i DNB Teknologi-e-posten (se compare_funds
# i dnb-teknologi-a.yaml) - ikke et selvstendig fond med egen e-post/
# validering, så det er ikke satt opp med nav_source eller benchmarks.
refresh_hint: >-
  Hent ny "topp 100 beholdninger"-liste fra Morningstar (fond-ID F0000041E7,
  uverifisert - se holdings-CSV-en).

holdings_source:
  type: manual
  morningstar_secid: F0000041E7
  manual_file: config/funds/dnb-disruptive-opportunities-c1.holdings.csv
  as_of: 2026-06-30
  # Morningstar oppgir bare topp 99 poster og ingen kontantandel, så listen kan
  # være avkortet i forhold til fondets fulle beholdning. De 97 postene vi har
  # navn og vekt for summerer til 94,66 %; resten (5,34 %) er ukjent -
  # halerester og/eller kontanter - og behandles som kontanter (null
  # avkastning) i mangel av bedre informasjon.
  cash_pct: 5.34
  equity_pct: 94.66

