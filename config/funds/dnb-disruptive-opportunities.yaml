# Navn som med vilje ikke prises. Vekten deres holdes utenfor
# aksjeavkastningen og normaliseres bort sammen med den avkortede halen.
ignore:
  - Kontanter
  - Cash
  # SpaceX er unotert. Det finnes ingen dagskurs å hente, ikke fordi
  # kartleggingen mangler, men fordi selskapet ikke handles. Å la den stå som
  # "uten kurs" ville gitt et varsel hver eneste dag om noe som aldri kan
  # løses, så den holdes utenfor i stedet.
  - Space Exploration Technologies Corp Class A

# To navn er med vilje UTEN ticker over, fordi de ikke lot seg lese sikkert
# fra kilden:
#   Octave Intelligence PLC SEDR   0,608 %
#   NaNexco Corp                   0,226 %
# De rapporteres som "uten kurs" i hvert estimat. Det er meningen: varselet
# står til navnet er verifisert mot Morningstar og tickeren lagt inn. Samlet
# vekt er ca. 0,8 %, så de normaliseres bort uten å flytte estimatet mye.
