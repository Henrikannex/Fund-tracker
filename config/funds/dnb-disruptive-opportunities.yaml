id: dnb-disruptive-opportunities
name: DNB Disruptive Opportunities
currency: EUR

isin: LU2061961574

# Ikke verifisert mot DNBs eget faktaark - dnbam.com svarte ikke - men to
# uavhengige fondsaggregatorer oppgir 0,76 % for C1-klassen. Sjekk mot
# faktaarket hvis tallet skal brukes til noe mer enn e-postlinjen.
total_cost_pct: 0.76
trading_days_per_year: 252

refresh_hint: >-
  Hent ny liste fra Morningstar (fond-ID F0000041E7). Merk at uttrekket er
  avkortet til 99 poster, så halen mangler uansett hvor ferskt det er.

holdings_source:
  type: manual
  morningstar_secid: F0000041E7
  manual_file: config/funds/dnb-disruptive-opportunities.holdings.csv
  as_of: 2026-06-30

  # Lista er en topp-99, ikke hele porteføljen: de 97 postene summerer til
  # 96,49 %. De resterende 3,51 % er både ekte kontanter OG den avkortede
  # halen, og her behandles alt som kontanter, altså null avkastning.
  #
  # Det er en kjent, ensidig skjevhet: halen er små vekstaksjer som beveger seg
  # mer enn snittet, ikke mindre, så på store dager vil estimatet dempe litt.
  # Alternativet - å normalisere halen opp som om den lignet resten - overdriver
  # motsatt vei. Med 3,5 % er begge feilene små nok til å leve med.
  cash_pct: 3.511
  equity_pct: 96.489

# Navn slik Morningstar-uttrekket skriver dem -> pristicker og noteringsvaluta.
