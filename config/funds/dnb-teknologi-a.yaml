id: dnb-teknologi-a
name: DNB Teknologi A
isin: NO0010337678
currency: NOK

# Total pris (TER) i prosent per år, slik Nordnet oppgir den.
# Trekkes fra estimatet fordelt på handelsdager.
total_cost_pct: 1.14
trading_days_per_year: 252

# Følger med i varselet når beholdningene begynner å bli gamle, så påminnelsen
# kommer med løsningen. Backtesten viser rundt 0,05 %-poeng skjevhet per måned
# med foreldelse, så to oppdateringer i året holder den under 0,15.
refresh_hint: >-
  Hent ny liste fra Morningstar (fond-ID F0000027G1) eller DNBs halvårsrapport
  på dnbam.com, som skal foreligge senest to måneder etter periodeslutt.

holdings_source:
  # "manual" leser CSV-fila under. Beholdningene endres bare månedlig, så det
  # er to minutter arbeid i måneden mot et scrapingoppsett som ryker hver gang
  # noen pusser på en nettside.
  #
  # Bytt til "auto" for å prøve fjernkildene i rekkefølge, med CSV-fila som
  # fallback. Gjør det først når "probe" har vist at en av dem faktisk svarer.
  type: manual
  order: [morningstar, nordnet]

  # Morningstar er kilden Nordnet selv lisensierer dataene fra, så den er ett
  # ledd ferskere. Den oppgir også ticker og valuta per beholdning, som ville
  # gjort ticker-tabellen under overflødig.
  morningstar_secid: F0GBR04NGU

  # TODO: fyll inn fra Nordnet-URL-en, f.eks. .../market/funds/16802428
  instrument_id: null

  manual_file: config/funds/dnb-teknologi-a.holdings.csv
  # Dato beholdningene gjelder fra, hvis Nordnet oppgir den. Uten denne måles
  # snapshot-alder fra da fila sist ble hentet, som undervurderer alderen.
  # Datoen DNBs fondbeholdningsrapport oppgir for beholdningslista.
  as_of: 2026-06-26
  # Kontantandelen DNBs rapport oppgir indirekte: 100 % minus summen av alle
  # postene (98,35 %). Behandles som null avkastning.
  cash_pct: 1.65
  equity_pct: 98.35

nav_source:
  # Faktisk NAV-historikk. Uten denne kan modellen ikke valideres i det hele
  # tatt, så dette er det første som må verifiseres for et nytt fond.
  #
  # 0P00000MVB er fondets Morningstar-kode. Yahoo lister europeiske fond under
  # den koden med varierende markedssuffiks; "probe" prøver alle.
  # "auto" prøver Yahoo, så Morningstars tidsserie, så den manuelle fila.
  type: auto
  ticker: 0P00000MVB.OL
  yahoo_stem: 0P00000MVB
  morningstar_secid: F0GBR04NGU

  # Investing.com fører fondets kurs under Morningstar-koden, og publiserer den
  # tidligere enn Nordnet viser den. "watch"-kommandoen følger denne siden,
  # skriver nye dager til fila under og måler estimatet vårt mot dem. Det er
  # også slik historikken vedlikeholder seg selv i stedet for å limes inn.
  investing_url: https://www.investing.com/funds/dnb-teknologi-nok-historical-data
  # Numerisk instrument-id. Står ikke i URL-en, så den letes fram fra
  # sidekilden når feltet er tomt. Fyll den inn hvis søket viser seg ustabilt.
  investing_pair_id: null

  # Kolonner: date,nav. Skrives av "watch", og er kilden backtesten leser fra.
  # Kan fylles inn for hånd hvis siden slutter å svare.
  manual_file: data/nav/dnb-teknologi-a.csv

# Navn slik DNBs fondbeholdningsrapport skriver dem -> pristicker og
# noteringsvaluta.
#
# Valutaen er ikke kosmetikk: fondet er i NOK, så avkastningen til hver post er
# lokal kursendring GANGE valutaendring mot NOK. Velger vi feil notering for et
# selskap med flere lister, blir valutaleddet feil selv om kursutviklingen er
# nesten identisk.
#
# Fram til 26.06.2026-oppdateringen var navnene Morningstars fulle
# klassenavn ("Alphabet Inc Class A"); DNBs rapport bruker korte
# selskapsnavn, så nøklene under er byttet til å matche. Noteringsvalget for
# hver videreførte post er ikke rekontrollert i denne oppdateringen - kun
# navnet er byttet - unntatt de seks tvetydige selskapene, som er verifisert
# mot landflaggene Nordnet viser, 31.07.2026: SAP Tyskland, ASML Nederland,
# Nokia Finland, Sony USA (altså ADR-en, ikke Tokyo-aksjen), Samsung (GDR i
# London, selv om navnet ikke lenger sier det), og Nintendo (Tokyo-notering
# valgt i mangel av et flagg å sjekke mot, siden posten er ny i lista).
