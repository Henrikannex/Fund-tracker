id: dnb-teknologi-a
name: DNB Teknologi A
isin: NO0010337678
currency: NOK

# Total pris (TER) i prosent per år, slik Nordnet oppgir den.
# Trekkes fra estimatet fordelt på handelsdager.
total_cost_pct: 1.14
trading_days_per_year: 252

holdings_source:
  # "manual" leser CSV-fila under. Beholdningene endres bare månedlig, så det
  # er to minutter arbeid i måneden mot et scrapingoppsett som ryker hver gang
  # noen pusser på en nettside.
  #
  # Bytt til "auto" for å prøve fjernkildene i rekkefølge, med CSV-fila som
  # fallback. Gjør det først når "probe" har vist at en av dem faktisk svarer.
  type: manual
  order: [morningstar, nordnet]

  # Morningstar er kilden Nordnet selv lisensierer dataene fra, så den er ett
  # ledd ferskere. Den oppgir også ticker og valuta per beholdning, som ville
  # gjort ticker-tabellen under overflødig.
  morningstar_secid: F0GBR04NGU

  # TODO: fyll inn fra Nordnet-URL-en, f.eks. .../market/funds/16802428
  instrument_id: null

  manual_file: config/funds/dnb-teknologi-a.holdings.csv
  # Dato beholdningene gjelder fra, hvis Nordnet oppgir den. Uten denne måles
  # snapshot-alder fra da fila sist ble hentet, som undervurderer alderen.
  as_of: null
  cash_pct: null

nav_source:
  # Faktisk NAV-historikk. Uten denne kan modellen ikke valideres i det hele
  # tatt, så dette er det første som må verifiseres for et nytt fond.
  #
  # 0P00000MVB er fondets Morningstar-kode. Yahoo lister europeiske fond under
  # den koden med varierende markedssuffiks; "probe" prøver alle.
  # "auto" prøver Yahoo, så Morningstars tidsserie, så den manuelle fila.
  type: auto
  ticker: 0P00000MVB.OL
  yahoo_stem: 0P00000MVB
  morningstar_secid: F0GBR04NGU
  # Kolonner: date,nav. Fyll inn for hånd hvis ingen automatisk kilde svarer -
  # NAV-historikk kan lastes ned fra DNBs egne kurssider.
  manual_file: data/nav/dnb-teknologi-a.csv

# Navn slik Nordnet skriver dem -> pristicker og noteringsvaluta.
#
# Valutaen er ikke kosmetikk: fondet er i NOK, så avkastningen til hver post er
# lokal kursendring GANGE valutaendring mot NOK. Velger vi feil notering for et
# selskap med flere lister (STM i Paris vs. New York), blir valutaleddet feil
# selv om kursutviklingen er nesten identisk.
#
# Noteringene under er lest av landflaggene Nordnet viser ved hver beholdning,
# 31.07.2026. Det avgjorde de seks tvetydige navnene: STM Frankrike, SAP
# Tyskland, ASML Nederland, Nokia Finland, Sony USA (altså ADR-en, ikke
# Tokyo-aksjen), og Samsung som allerede het GDR i navnet.
tickers:
  # --- USA, USD. Disse er entydige. ---
  Microsoft:                   {ticker: MSFT,      currency: USD}
  Amazon.com:                  {ticker: AMZN,      currency: USD}
  Alphabet A:                  {ticker: GOOGL,     currency: USD}
  Meta Platforms A:            {ticker: META,      currency: USD}
  NVIDIA:                      {ticker: NVDA,      currency: USD}
  Atlassian A:                 {ticker: TEAM,      currency: USD}
  Visa:                        {ticker: V,         currency: USD}
  Broadcom:                    {ticker: AVGO,      currency: USD}
  Oracle:                      {ticker: ORCL,      currency: USD}
  Mastercard:                  {ticker: MA,        currency: USD}
  Apple:                       {ticker: AAPL,      currency: USD}
  T-Mobile US:                 {ticker: TMUS,      currency: USD}
  Marvell Technology:          {ticker: MRVL,      currency: USD}
  ServiceNow:                  {ticker: NOW,       currency: USD}
  # Logoen på Nordnet er HP Inc., ikke Hewlett Packard Enterprise (HPE).
  HP:                          {ticker: HPQ,       currency: USD}

  # --- Europa, primærnotering. VERIFISER disse. ---
  Ericsson B:                  {ticker: ERIC-B.ST, currency: SEK}
  STMicroelectronics NV:       {ticker: STMPA.PA,  currency: EUR}
  Sap SE:                      {ticker: SAP.DE,    currency: EUR}
  Dassault Systemes SE:        {ticker: DSY.PA,    currency: EUR}
  ADYEN:                       {ticker: ADYEN.AS,  currency: EUR}
  ASML HOLDING:                {ticker: ASML.AS,   currency: EUR}
  Nokia:                       {ticker: NOKIA.HE,  currency: EUR}
  Nordic Semiconductor:        {ticker: NOD.OL,    currency: NOK}

  # --- Asiatiske selskaper, men ikke asiatiske noteringer ---
  # Navnet sier eksplisitt GDR Reg S, altså London-noteringen i USD,
  # ikke Seoul-aksjen.
  Samsung Electr-Gdr Reg S:    {ticker: SMSN.IL,   currency: USD}
  # Amerikansk flagg på Nordnet, altså ADR-en i New York. Det er ikke bare et
  # valutaspørsmål: Tokyo stenger 08:00 norsk tid, New York 22:00. ADR-en
  # prises altså på samme klokkeslett som resten av fondet.
  Sony Group Corporation:      {ticker: SONY,      currency: USD}

# Navn som med vilje ikke prises (kontanter, derivater, pengemarked).
# Vekten deres holdes utenfor aksjeavkastningen.
ignore:
  - Kontanter
  - Cash
