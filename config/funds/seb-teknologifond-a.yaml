id: seb-teknologifond-a
name: SEB Teknologifond A
isin: SE0000984114
currency: SEK

# SEBs oppgitte årlige forvaltningshonorar for andelsklasse A.
total_cost_pct: 1.50
trading_days_per_year: 252

# Kun brukt som sammenligningsfond i DNB Teknologi-e-posten (se compare_funds
# i dnb-teknologi-a.yaml) - ikke et selvstendig fond med egen e-post/
# validering, så det er ikke satt opp med nav_source eller benchmarks.
refresh_hint: >-
  Hent ny beholdningsliste fra Morningstar (fond-ID F0GBR04M6J) eller SEBs
  fondsside.

holdings_source:
  type: manual
  morningstar_secid: F0GBR04M6J
  manual_file: config/funds/seb-teknologifond-a.holdings.csv
  as_of: 2026-06-30
  # Aksjedelen summerte til 97,405 % i kilden. Fondet holder i tillegg en
  # Nasdaq-100-future som netter mot en kontant-offset (netto 0,000 %) og en
  # håndfull valutakontoer som til sammen utgjør resten. Futuren er utelatt
  # fra beholdningslista i stedet for å prises, siden nettoeffekten av den og
  # motposten allerede er null - se holdings-CSV-en for detaljer.
  cash_pct: 2.595
  equity_pct: 97.405

