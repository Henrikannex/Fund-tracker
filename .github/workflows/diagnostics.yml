name: Diagnostikk

# Finner ut hva som faktisk virker mot Nordnet, Morningstar og Yahoo. Kan ikke
# testes fra et utviklingsmiljø uten nettilgang, så denne kjøringen er eneste
# måten å verifisere nettverkskoden på.

on:
  # Kjører også når fondsoppsettet eller en datakilde endres. Det er nettopp da
  # man vil vite om kildene fortsatt svarer.
  push:
    paths:
      - "config/funds/**"
      # Hele pakken, ikke bare sources/. Første forsøk lyttet bare på
      # datakildene, så endringer i selve modellen gikk utestet gjennom.
      - "src/fundtracker/**"
      - ".github/workflows/diagnostics.yml"
  workflow_dispatch:
    inputs:
      fund:
        description: Fond-ID
        default: dnb-teknologi-a
      task:
        description: Hva skal kjøres
        type: choice
        default: alt
        options: [alt, probe, resolve, estimate, validate, backtest, probe-price, probe-instrument-price, probe-yahoo-price]
      backtest_days:
        description: Antall handelsdager i backtesten
        default: "250"
      url:
        description: Nordnet-aksjeside å inspisere (kun for probe-price)
        default: ""
      ticker:
        description: Ticker (kun for probe-instrument-price)
        default: "MSFT"
      market:
        description: Markedskode (kun for probe-instrument-price)
        default: "XNAS"

jobs:
  run:
    runs-on: ubuntu-latest
    env:
      PYTHONPATH: src
      # inputs er tomt når kjøringen kommer fra push, så defaultene må settes her.
      FUND: ${{ inputs.fund || 'dnb-teknologi-a' }}
      TASK: ${{ inputs.task || 'alt' }}
      BACKTEST_DAYS: ${{ inputs.backtest_days || '250' }}
      URL: ${{ inputs.url || '' }}
      TICKER: ${{ inputs.ticker || 'MSFT' }}
      MARKET: ${{ inputs.market || 'XNAS' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt

      - name: Hvilke kilder svarer
        if: env.TASK == 'alt' || env.TASK == 'probe'
        continue-on-error: true
        run: python -m fundtracker.cli probe "$FUND"

      - name: Ticker-dekning
        if: env.TASK == 'alt' || env.TASK == 'resolve'
        continue-on-error: true
        run: python -m fundtracker.cli resolve "$FUND"

      - name: Estimat for siste handelsdag
        if: env.TASK == 'alt' || env.TASK == 'estimate'
        continue-on-error: true
        # --latest, fordi diagnostikken som regel kjøres midt på dagen når
        # dagens børsdag ikke er ferdig. Da er gårsdagen det interessante.
        run: python -m fundtracker.cli estimate "$FUND" --latest

      - name: Mot Nordnets publiserte periodetall
        if: env.TASK == 'alt' || env.TASK == 'validate'
        continue-on-error: true
        run: python -m fundtracker.cli validate "$FUND"

      - name: Backtest mot faktisk NAV
        if: env.TASK == 'alt' || env.TASK == 'backtest'
        continue-on-error: true
        run: python -m fundtracker.cli backtest "$FUND" --days "$BACKTEST_DAYS"

      - name: Nordnet-aksjeside - hva avslører den om en pris-API
        # Ikke del av "alt": trenger en URL, og er research, ikke drift.
        if: env.TASK == 'probe-price'
        continue-on-error: true
        run: python -m fundtracker.cli probe-price "$URL"

      - name: Nordnet - slå opp instrument-id og prøv å hente pris
        if: env.TASK == 'probe-instrument-price'
        continue-on-error: true
        run: python -m fundtracker.cli probe-instrument-price "$TICKER" "$MARKET"

      - name: Yahoo-kursside - hva avslører den om prisen
        # Sjekker både $TICKER (default MSFT, som virker fint i dag) og
        # SAP.DE (en av de europeiske postene Yahoo mangler dagskurs for),
        # for å se om nettsiden vet noe nedlastings-APIet ikke gjør.
        if: env.TASK == 'probe-yahoo-price'
        continue-on-error: true
        run: |
          python -m fundtracker.cli probe-yahoo-price "$TICKER"
          echo
          python -m fundtracker.cli probe-yahoo-price "SAP.DE"
