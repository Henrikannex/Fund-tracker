name: Dagens fondsestimat

on:
  schedule:
    # GitHub-cron er alltid UTC, så vi ankrer til amerikansk stengetid (16:00 ET):
    #   20:15 UTC = 22:15 norsk tid når USA har sommertid (mars-november)
    #   21:15 UTC = 22:15 norsk tid når USA har vintertid
    # Begge kjører hele året. Den andre avslutter uten å gjøre noe dersom
    # dagens estimat allerede er logget, så vi slipper datomatematikk.
    - cron: "15 20 * * 1-5"
    - cron: "15 21 * * 1-5"
    # Retry-vindu: hvert 30. minutt til 23:45 UTC hvis kursene fortsatt mangler
    # (exit 3 under). Yahoo har hatt hele batcher med europeiske/nordiske
    # sluttkurser stående som null i flere timer, lenge etter at børsene
    # stengte - se docstringen i closing_prices(). --skip-if-logged gjør at
    # kjøringen som til slutt lykkes er den eneste som faktisk sender noe;
    # resten er billige nei-operasjoner.
    #
    # Vinduet stopper før midnatt UTC, men det avgjør ikke lenger hvilken dag
    # estimatet gjelder: måldagen regnes ut fra tidspunktet kjøringen var
    # planlagt til, ikke fra klokka når den faktisk startet. Se steget
    # "Finn måldagen" - en kjøring GitHub skyver til neste morgen gjelder
    # fortsatt kvelden den var ment for.
    - cron: "45 20 * * 1-5"
    - cron: "45 21 * * 1-5"
    - cron: "15,45 22-23 * * 1-5"
  workflow_dispatch:
    inputs:
      fund:
        description: Fond-ID
        default: dnb-teknologi-a
      date:
        description: Dato (YYYY-MM-DD), tomt = i dag
        default: ""
      send_email:
        description: Send e-post
        type: boolean
        default: true
      latest:
        description: >-
          Bruk siste dag med fullstendige kurser i stedet for i dag. Kun for
          manuelle kjøringer - den planlagte jobben skal alltid gjelde dagen
          den kjører, ellers kan den sende et gammelt tall uten å si fra.
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: daily-estimate
  cancel-in-progress: false

jobs:
  estimate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Oppdater beholdninger
        # Skal ikke velte hele kjøringen: estimatet faller tilbake på
        # den manuelle beholdningsfilen hvis Nordnet ikke svarer.
        continue-on-error: true
        run: python -m fundtracker.cli snapshot "${{ inputs.fund || 'dnb-teknologi-a' }}"
        env:
          PYTHONPATH: src

      - name: Finn måldagen
        id: target
        # GitHub kjører ikke cron presist, og køtiden er ikke stabil: i uke 35
        # 2026 vokste den fra en halvtime til over åtte timer, så hele
        # retry-vinduet havnet på neste morgen UTC. Fram til nå gjaldt
        # estimatet alltid date.today() på runneren, og en kjøring planlagt
        # torsdag kveld spurte da etter fredagens sluttkurser fredag morgen,
        # før noen børs hadde åpnet: 96 % av fondet uten kurs, exit 3, ingen
        # e-post. Kjøringen ble grønn, for exit 3 er et normalt utfall, så
        # fem dager gikk uten varsel før noen så etter.
        #
        # Måldagen er derfor siste gang klokka passerte cron-tida, ikke
        # dagen kjøringen tilfeldigvis startet. Da er en forsinket kjøring
        # fortsatt riktig dag, uansett hvor lenge den lå i kø.
        env:
          # Gjennom env, ikke interpolert inn i skriptet: en dispatch-input er
          # tekst noen har skrevet, og skal ikke kunne bli shell-kode.
          INPUT_DATE: ${{ inputs.date }}
          CRON: ${{ github.event.schedule }}
          EVENT: ${{ github.event_name }}
        run: |
          if [ -n "$INPUT_DATE" ]; then
            target="$INPUT_DATE"
          elif [ "$EVENT" = "schedule" ]; then
            # Første verdi i minutt- og timefeltet holder: "15,45 22-23 * * 1-5"
            # er planlagt fra 22:15, og alle tidene i ett vindu er samme kveld.
            read -r minute hour _ <<< "$CRON"
            scheduled=$(( 10#${hour%%[,-]*} * 60 + 10#${minute%%[,-]*} ))
            now=$(( 10#$(date -u +%H) * 60 + 10#$(date -u +%M) ))
            # Kvarteret er slingringsmonn for klokkeskeiv, ikke for forsinkelse:
            # starter kjøringen minuttet før cron-tida, er det samme kveld, ikke
            # dagen før. Ekte forsinkelser måles i timer og treffer aldri her.
            if [ $(( now - scheduled )) -lt -15 ]; then
              target=$(date -u -d yesterday +%F)
            else
              target=$(date -u +%F)
            fi
          else
            target=$(date -u +%F)
          fi
          # inputs.date er tekst noen har skrevet for hånd. Den skal ikke nå
          # lenger enn hit uten å se ut som en dato.
          if [[ ! "$target" =~ ^[0-9]{4}-[0-9]{2}-[0-9]{2}$ ]]; then
            echo "Ugyldig dato: '$target'. Bruk YYYY-MM-DD." >&2
            exit 1
          fi
          echo "Måldag: $target (kjører $(date -u '+%F %H:%M') UTC)"
          echo "date=$target" >> "$GITHUB_OUTPUT"

      - name: Regn ut og send estimat
        # Exit 3 betyr "for mange kurser mangler ennå". Det skjer hver dag på
        # den av de to cron-tidene som ligger før amerikansk stengetid, og er
        # et normalt utfall - ikke en feil. Alt annet skal velte kjøringen.
        run: |
          set +e
          python -m fundtracker.cli estimate \
            "${{ inputs.fund || 'dnb-teknologi-a' }}" \
            --date "$TARGET_DATE" \
            --save \
            ${{ github.event_name == 'schedule' && '--skip-if-logged' || '' }} \
            ${{ inputs.latest && '--latest' || '' }} \
            ${{ (github.event_name == 'schedule' || inputs.send_email) && '--email' || '' }}
          status=$?
          if [ $status -eq 3 ]; then
            echo "Kurser ikke klare ennå - venter på neste kjøring."
            exit 0
          fi
          exit $status
        env:
          TARGET_DATE: ${{ steps.target.outputs.date }}
          PYTHONPATH: src
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          MAIL_TO: ${{ secrets.MAIL_TO }}
          MAIL_BCC: ${{ secrets.MAIL_BCC }}

      - name: Lagre estimat og beholdninger i repoet
        env:
          TARGET_DATE: ${{ steps.target.outputs.date }}
        run: |
          if [ -z "$(git status --porcelain data)" ]; then
            echo "Ingen endringer i data/"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          git commit -m "data: estimat og beholdninger $TARGET_DATE"
          git push
