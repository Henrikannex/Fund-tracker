name: Undersøk Yahoo-vinduet

# Engangsjobb. Yahoo er ikke tilgjengelig fra utviklingsmiljøet, så dette er
# eneste stedet spørsmålet kan besvares. Slettes når svaret står i koden.

on:
  workflow_dispatch:
  push:
    paths:
      - "tools/probe_window.py"
      - ".github/workflows/probe-window.yml"

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python tools/probe_window.py
        env:
          PYTHONPATH: src
