name: Morgenestimat

# Henter gårsdagen når kveldsjobben ikke fikk kurser.
#
# Kveldsjobben sender bare når kursene faktisk er der, og det er riktig. Men
# hele denne uken har Yahoo manglet sluttkursen for hver eneste europeiske og
# nordiske post i fondet - 18 % av beholdningene, langt over ferskhetsgrensen
# på 5 % - på alle klokkeslettene i kveldsvinduet. Da stoppet kveldsjobben, og
# ingen e-post gikk ut i det hele tatt.
#
# De samme kursene ligger der neste morgen. Estimatet for 2026-09-02 ble regnet
# ut uten et eneste forbehold kl. 10:35 UTC dagen etter, med SAP, ASML, Ericsson
# og resten på plass. Så i stedet for å bytte kursleverandør eller senke
# grensen, får dagen et forsøk til når dataene er der.
#
# Datoen settes eksplisitt til i går, ikke --latest: en jobb som selv leter seg
# bakover kan ende med å sende et fire dager gammelt tall som om det var nytt.
# Er dagen allerede logget - altså sendt i går kveld - avslutter --skip-if-logged
# kjøringen uten å sende noe.

on:
  schedule:
    # Tirsdag-lørdag, fordi jobben gjelder gårsdagen: lørdag dekker fredag.
    #
    # Klokkeslettene er målt, ikke gjettet. Yahoo nullstiller dagsstolpen når
    # børsens egen klokke passerer midnatt og skriver sluttkursen tilbake noen
    # timer senere. For 3. september så det slik ut, målt med probe-close:
    #
    #   21:41 UTC   3 av 61 uten kurs   (alt på plass, før europeisk midnatt)
    #   22:21 UTC  21 av 61 uten kurs   (CEST-børsene nullstilt kl. 22:00)
    #   23:41 UTC  22 av 61 uten kurs   (London og Lisboa fulgte kl. 23:00)
    #   06:46 UTC  59 av 61 uten kurs   (USA nullstilt kl. 04:00, ingen påfylt)
    #   09:37 UTC   2 av 61 uten kurs   (alt tilbake)
    #
    # Påfyllet er altså ferdig et sted mellom 06:46 og 09:37. Første forsøk
    # ligger like før det vinduet i tilfelle en rask dag, de to andre trygt
    # etter. Forsøk koster under et minutt, og alle bortsett fra det som
    # lykkes avslutter uten å gjøre noe.
    - cron: "0 8 * * 2-6"    # 10:00 norsk tid
    - cron: "0 10 * * 2-6"   # 12:00 norsk tid
    # Dagens siste forsøk, og det som sier fra på e-post hvis kursene fortsatt
    # ikke er der (--notify-if-blocked under). Varselet henger på cron-strengen,
    # ikke på klokkeslettet, så en forsinket kjøring sier fra like fullt og
    # bare én gang.
    - cron: "0 12 * * 2-6"   # 14:00 norsk tid
  workflow_dispatch:
    inputs:
      fund:
        description: Fond-ID
        default: dnb-teknologi-a
      date:
        description: Dato (YYYY-MM-DD), tomt = i går
        default: ""
      send_email:
        description: Send e-post
        type: boolean
        default: true

permissions:
  contents: write

# Samme gruppe som kveldsjobben: begge skriver til data/ og pusher, og to
# samtidige kjøringer ville tapt den ene pushen.
concurrency:
  group: daily-estimate
  cancel-in-progress: false

jobs:
  catchup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Regn ut og send gårsdagens estimat
        # Exit 3 betyr "for mange kurser mangler ennå" og er fortsatt et normalt
        # utfall her: er ikke kursene på plass kl. 10, kan de være det kl. 12.
        run: |
          target="${{ inputs.date }}"
          if [ -z "$target" ]; then
            target="$(date -u -d yesterday +%Y-%m-%d)"
          fi
          echo "Gjelder $target"
          set +e
          python -m fundtracker.cli estimate \
            "${{ inputs.fund || 'dnb-teknologi-a' }}" \
            --date "$target" \
            --save \
            --skip-if-logged \
            ${{ github.event.schedule == '0 12 * * 2-6' && '--notify-if-blocked' || '' }} \
            ${{ (github.event_name == 'schedule' || inputs.send_email) && '--email' || '' }}
          status=$?
          if [ $status -eq 3 ]; then
            echo "Kursene for $target er fortsatt ikke komplette."
            exit 0
          fi
          exit $status
        env:
          PYTHONPATH: src
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          MAIL_TO: ${{ secrets.MAIL_TO }}
          MAIL_BCC: ${{ secrets.MAIL_BCC }}

      - name: Lagre estimatet i repoet
        run: |
          if [ -z "$(git status --porcelain data)" ]; then
            echo "Ingen endringer i data/"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          git commit -m "data: etterslepsestimat $(date -u +%Y-%m-%d)"
          # Rebase og prøv igjen hvis noe annet pushet i mellomtiden. Uten det
          # forsvinner committen med runneren, og jobben blir rød av en grunn
          # som ikke har noe med estimatet å gjøre.
          for _ in 1 2 3; do
            if git push; then
              exit 0
            fi
            git pull --rebase origin "$GITHUB_REF_NAME"
          done
          git push
