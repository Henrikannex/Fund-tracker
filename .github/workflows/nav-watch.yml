name: Følg med på publisert kurs

# Fondet publiserer NAV en dag før Nordnet viser den. Denne jobben ser etter
# nye dager, legger dem i historikken og sier fra hva estimatet vårt bommet
# med. Det er også slik NAV-historikken vedlikeholder seg selv, i stedet for
# å måtte limes inn for hånd.

on:
  schedule:
    # Kursen dukker opp i løpet av formiddagen, men når varierer. Fire daglige
    # sjekker var gratis så lenge jobben var stille når ingenting var nytt.
    #
    # Det er den ikke lenger. Ingen NAV-kilde svarer en Actions-runner i dag -
    # Investing.com gir 403, og verken Yahoo eller Morningstar fører fondets
    # kurs - så kommandoen avslutter med exit 4, som den skal. Fire røde
    # kjøringer daglig om samme kjente feil er varsling folk slutter å lese,
    # og da er vi tilbake der vi startet.
    #
    # Én kjøring holder signalet i live. Den planlagte kjøringen gjør exit 4
    # om til en advarsel i stedet for en feil: en kjent, dokumentert mangel
    # skal ikke vises som en ødelagt kodebase. Alt annet enn exit 4 gjør
    # fortsatt jobben rød, og en manuell kjøring er alltid rød ved exit 4 -
    # kjører du den for hånd, er det nettopp for å se om kilden svarer.
    - cron: "0 9 * * 1-6"
  workflow_dispatch:
    inputs:
      fund:
        description: Fond-ID
        default: dnb-teknologi-a
      send_email:
        description: Send varsel hvis det finnes nye dager
        type: boolean
        default: true
      days:
        description: Hvor mange dager tilbake som hentes
        default: "30"

permissions:
  contents: write

concurrency:
  # To samtidige kjøringer ville begge skrevet til NAV-fila og kollidert i push.
  group: nav-watch
  cancel-in-progress: false

jobs:
  watch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Se etter nye publiserte kurser
        id: watch
        run: |
          set +e
          python -m fundtracker.cli watch \
            "${{ inputs.fund || 'dnb-teknologi-a' }}" \
            --days "${{ inputs.days || '30' }}" \
            ${{ (github.event_name == 'schedule' || inputs.send_email) && '--email' || '' }}
          code=$?
          set -e
          # Exit 4 = ingen NAV-kilde svarte. Kjent og dokumentert i README-en,
          # ikke en feil i koden. Planlagte kjøringer melder det som advarsel;
          # manuelle kjøringer og alle andre feilkoder går rødt.
          if [ "$code" -eq 4 ] && [ "${{ github.event_name }}" = "schedule" ]; then
            echo "::warning title=Ingen NAV-kilde::Ingen kilde svarte. Historikken står stille til en av dem er tilbake."
            exit 0
          fi
          exit "$code"
        env:
          PYTHONPATH: src
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          MAIL_TO: ${{ secrets.MAIL_TO }}
          MAIL_BCC: ${{ secrets.MAIL_BCC }}

      - name: Lagre ny kurshistorikk
        run: |
          if [ -z "$(git status --porcelain data)" ]; then
            echo "Ingen nye kurser."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          git commit -m "data: publisert kurs $(date -u +%Y-%m-%d)"
          # Døgnjobben kan ha pushet i mellomtiden; hent inn før vi skyver.
          git pull --rebase --autostash origin "${GITHUB_REF_NAME}"
          git push origin "HEAD:${GITHUB_REF_NAME}"
